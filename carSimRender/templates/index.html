{% load static %}


<!DOCTYPE html>
<head>
   <meta charset="utf-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <title>WebGPU Renderer</title>
   <meta name="description" content="">
   <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
   <h1>CarSim: WebGPU application for cardiac simulation</h1><br>

   <h2 id="id-gpu-check"></h2><br><br>

   <div>
      <form enctype="multipart/form-data" method="post">
         {% csrf_token %}
         {{ form }}  
         <button type="submit"  id='btn-uploadMesh'> Upload Mesh</button>
     </form>
 
     {%if url%}
       <p> Uploaded File: <a href="{{ url }}">{{ url }}</a></p>
     {% endif %}
   </div>

   
   
   <div>


      <label>Color:</label>
      <input type="text" id="id-color" value="0.0, 1.0, 0.0">
      <button type='button' id='btn-change-color'>Change Color</button>
      <br>
      <canvas id="canvas-webgpu" width="720" height="640"></canvas>
      <br>
      <button type='button' id='btn-printvc'>Print Mesh Info</button>
   
      
   </div>

   {{ data|json_script:"data" }}
   <script>
      const djangodata = JSON.parse(document.getElementById('data').textContent);
   </script>


   <script src="{% static 'carSimRender/main/dist/main.bundle.js' %}"></script>



   
   






   

   

</body>
</html>
