<!-- {% load static %} -->


<!DOCTYPE html>
<head>
   <meta charset="utf-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <title>Cocoro Tissue</title>
   <meta name="description" content="">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <style>
      body {
         margin: 0;
         padding: 0;
         display: flex;
         flex-direction: column;
         align-items: flex-start;
      }
      form, h1, h2, button {
         margin: 5px 0;
      }
      select {
         width: 100%;
      }
      .form-container {
         display: flex;
         gap: 20px;
         align-items: center;
      }
      .canvas-container {
         display: flex;
         flex-wrap: wrap;
         justify-content: flex-start;
      }
      .canvas-container canvas {
         margin: 10px;
      }
   </style>
</head>

<body>
   <h1>Cocoro: WebGPU application for cardiac TISSUE simulation</h1>
   <h2 id="id-gpu-check"></h2>
   <div class="form-container">
      <form id="selected_mesh">
         <label for="selectMeshOptions">Select a Mesh:</label>
         <select id="selectMeshOptions">
            {% for file in mesh_files %}
               <option value="{{ file }}">{{ file }}</option>
            {% endfor %}
         </select>
      </form>
      <form>
         <label>Select Extra Plot:</label>
         </br>
         <label for="cell_var_checkbox">cellVar</label>
         <input type="checkbox" id="cell_var_checkbox" name="canvasOptions">
         <label for="pECG_checkbox">pECG</label>
         <input type="checkbox" id="pECG_checkbox" name="canvasOptions">
      </form>
      <form id="selected_electrodes">
         <label for="selectElectrodesOptions">Select Electrodes:</label>
         <select id="selectElectrodesOptions">
            {% for file in electrodes_files %}
               <option value="{{ file }}">{{ file }}</option>
            {% endfor %}
         </select>
      </form>
      <form>
         <label>Mouse Stim</label>
         <input type="checkbox" id="mouse_stim_checkbox">
         <div id="mouseStim_gui" style="display: block;"></div>
      </form>
   </div>
   <button type='button' id='btn-simulate'>LET'S GO!</button>
   <div class="canvas-container">
      <canvas id="canvas-webgpu" width="400" height="300"></canvas>
      <canvas id="cell_var_canvas" width="400" height="300" style="display:none;"></canvas>
      <div id="cell_var_gui" style="display: none;"></div>
   </div>
   <div class="canvas-container">
      <canvas id="pECG_canvas" width="1100" height="400" style="display:none;"></canvas>
      <div id="pECG_gui" style="display: none;"></div>
   </div>
   <script src="{% static 'cocoroMain/main/dist/main_tissue.bundle.js' %}"></script>
</body>
</html>
